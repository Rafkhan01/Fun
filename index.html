<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #202124;
      color: #e8eaed;
      font-family: 'Roboto', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Tabs */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }

    .tabs {
      display: flex;
      gap: 20px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .tab {
      color: #9aa0a6;
      text-decoration: none;
      padding-bottom: 6px;
      font-weight: 500;
    }

    .tab.active {
      color: #8ab4f8;
      border-bottom: 2px solid #8ab4f8;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #e8eaed;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* Main Google Content */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 20px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .google-logo {
      font-size: 54px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -1.5px;
      margin-bottom: 24px;
      user-select: none;
    }

    /* Search Input Field */
    .search-bar {
      width: 100%;
      background-color: #303134;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 48px;
      border: 1px solid #3c4043;
    }

    .search-icon {
      color: #9aa0a6;
      margin-right: 12px;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-size: 16px;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #9aa0a6;
    }

    /* Language Bar */
    .languages {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #bdc1c6;
      line-height: 2;
    }

    .languages a {
      color: #8ab4f8;
      text-decoration: none;
      margin: 0 4px;
    }

    /* Trending Searches Section */
    .trending-section {
      width: 100%;
      max-width: 600px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .trending-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 400;
      color: #e8eaed;
      padding-bottom: 12px;
    }

    .trending-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-top: 1px solid #3c4043;
      cursor: pointer;
    }

    .trending-icon {
      margin-right: 18px;
      color: #9aa0a6;
      display: flex;
      align-items: center;
    }

    .trending-text {
      font-size: 15px;
      color: #e8eaed;
    }

    /* Matrix Overlay */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      display: none;
      background: #000;
    }

    .name-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      color: #00ff66;
      font-size: 42px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px #00ff66, 0 0 40px #00ff66;
      opacity: 0;
      transition: opacity 1s ease;
      text-align: center;
      pointer-events: none;
    }

    .name-overlay.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar" id="topBar">
    <div class="tabs">
      <a href="#" class="tab active">ALL</a>
      <a href="#" class="tab">IMAGES</a>
    </div>
    <div class="top-icons">
      <!-- Notification Bell -->
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
      </button>
      <!-- Grid App Icon -->
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Google UI -->
  <div class="container" id="mainContent">
    <div class="google-logo">Google</div>
    
    <div class="search-bar">
      <div class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>
      <input type="text" id="searchInput" class="search-input" autofocus onkeydown="checkSearch(event)">
      <div class="search-actions">
        <!-- Google Search Lens Icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 15c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/>
        </svg>
        <!-- Mic Icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
        <!-- Lens Camera Icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        </svg>
      </div>
    </div>

    <div class="languages">
      Google offered in:<br>
      <a href="#">हिन्दी</a> <a href="#">বাংলা</a> <a href="#">తెలుగు</a> <a href="#">मराठी</a> <a href="#">தமிழ்</a> <a href="#">ગુજરાતી</a> <a href="#">കന്നഡ</a> <a href="#">മലയാളം</a> <a href="#">ਪੰਜਾਬੀ</a>
    </div>
  </div>

  <!-- Trending Searches Section -->
  <div class="trending-section" id="trendingSection">
    <div class="trending-header">
      <span>Trending searches</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#9aa0a6">
        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    </div>

    <div class="trending-item" onclick="searchTrend('vetra')">
      <div class="trending-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      </div>
      <div class="trending-text">vetra</div>
    </div>

    <div class="trending-item" onclick="searchTrend('prime video movies')">
      <div class="trending-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      </div>
      <div class="trending-text">prime video movies</div>
    </div>

    <div class="trending-item" onclick="searchTrend('trump tariffs')">
      <div class="trending-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      </div>
      <div class="trending-text">trump tariffs</div>
    </div>

    <div class="trending-item" onclick="searchTrend('asian games')">
      <div class="trending-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      </div>
      <div class="trending-text">asian games</div>
    </div>
  </div>

  <!-- Matrix Animation Overlay -->
  <canvas id="matrixCanvas"></canvas>
  <div id="nameOverlay" class="name-overlay">YOUR NAME HERE</div>

  <script>
    // =========================================================
    // CONFIGURATION: Set your details here!
    // =========================================================
    const MY_NAME = "Rafkhan B"; // Search term to trigger animation
    const DISPLAY_NAME = "RAFKHAN B"; // Name shown on screen
    const LINKEDIN_URL = "https://share.google/SFxtgaDO8VHfNO5oB"; // Your actual LinkedIn URL

    function checkSearch(event) {
      if (event.key === 'Enter') {
        processSearch(document.getElementById('searchInput').value.trim());
      }
    }

    function searchTrend(text) {
      document.getElementById('searchInput').value = text;
      processSearch(text);
    }

    function processSearch(query) {
      if (!query) return;

      if (query.toLowerCase() === MY_NAME.toLowerCase()) {
        startMatrixAnimation();
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }
    }

    // Matrix Digital Rain Script
    function startMatrixAnimation() {
      // Hide interface
      document.getElementById('topBar').style.display = 'none';
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('trendingSection').style.display = 'none';

      const canvas = document.getElementById('matrixCanvas');
      const ctx = canvas.getContext('2d');
      canvas.style.display = 'block';

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
      const fontSize = 16;
      const columns = Math.floor(canvas.width / fontSize);
      const rainDrops = Array(columns).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00ff66';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

          if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            rainDrops[i] = 0;
          }
          rainDrops[i]++;
        }
      }

      setInterval(draw, 30);

      // Display Name
      setTimeout(() => {
        const nameOverlay = document.getElementById('nameOverlay');
        nameOverlay.textContent = DISPLAY_NAME;
        nameOverlay.classList.add('show');
      }, 2000);

      // Redirect to LinkedIn Profile
      setTimeout(() => {
        window.location.href = LINKEDIN_URL;
      }, 4500);
    }
  </script>
</body>
</html>
